<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미리보기 러너 — 자극 4블록 + 설문</title>
<!--
  preview.html — 자극과 설문을 실험 순서대로 이어 보기 위한 러너.

  아직 통합 러너(session.html)가 아니다. 없는 것:
    - 로그를 파일이 아니라 수집 서버로 보내기
    - laundry-ad 의 localStorage 키를 'ad_log_'+sid+'_'+stim+'_'+mode 로 맞추기 (INTEGRATION.md §2)

  들어 있는 것: 시작 안내 → 동의서 → 사전 문항 3 → 조작 연습 →
                (안내 → 자극 → 설문 29 → 휴식) × 4 → 기본 정보 2 → 디브리핑 → 종료.
  설문 문항과 참가자에게 보이는 문구는 survey.js 하나에서만 온다 — 고치려면 그쪽을 고친다.

  기본값은 참가자 화면이다. ?dev=1 을 붙여야 연구원용(블록 순서표·미리보기 설정·수집 결과
  내려받기·자극 건너뛰기)이 나온다. 그 안에는 조건명(watch/intervene)과 ver 이 그대로 적혀
  있어서, 참가자가 보면 형식을 비교하는 연구라는 것이 드러난다.

  화면 설계 메모 (123문항을 손으로 채우는 화면이라 밀도보다 오답 방지가 먼저다)
    - 행렬형(한 줄에 7칸)을 쓰지 않는다. 문항이 10개만 돼도 줄을 잘못 짚고, 좁은 화면에서 터진다.
      문항마다 눈금을 따로 두고 버튼을 크게 잡았다(최소 44px — 손가락 크기).
    - 척도 라벨은 문항마다 되풀이하지 않고 화면 위에 고정(sticky)해 둔다. 되풀이하면 글자가
      너무 많아지고, 없애면 스크롤 중에 1이 어느 쪽인지 잊는다.
    - 의미변별(섹션 C·D)은 양극 라벨이 문항마다 다르므로 문항 안에 둔다.
    - 참가자 화면은 밝은 배경이다. 자극은 어두운 전체화면이라, 설문까지 어두우면
      자극이 끝났는지 아닌지 구분이 흐려진다.

  실행:  저장소 루트에서
           cd game && npm run build && cd ..     # game/dist/ 가 있어야 한다
           python3 serve.py                      # 캐시를 끈 정적 서버
         브라우저에서  http://localhost:8000/preview.html
-->
<style>
  :root {
    --bg: #eef1f5;
    --card: #ffffff;
    --line: #dfe3ea;
    --fg: #1b1f27;
    --dim: #667085;
    --accent: #2563eb;
    --accent-soft: #e8effd;
    --warn: #c2410c;
    --warn-soft: #fff2e8;
    --ok: #15803d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; min-height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    font-size: 16px; line-height: 1.6;
  }

  /* ---------- 뼈대 ---------- */
  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 120px; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 12px 16px 10px;
  }
  .topbar .inner { max-width: 680px; margin: 0 auto; }
  .bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 9px; }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
  .crumb { font-size: 12.5px; color: var(--dim); letter-spacing: .02em; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px 22px; margin-top: 18px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  h2 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 14px; }
  .lead { font-size: 15.5px; }
  .dim { color: var(--dim); font-size: 13.5px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }

  /* ---------- 고정 눈금 라벨 ---------- */
  .legend {
    position: sticky; top: 56px; z-index: 15;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; margin: 0 0 6px;
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12.5px; color: var(--dim);
  }
  .legend b { font-weight: 600; color: #46506180; }

  /* ---------- 문항 ---------- */
  .item { padding: 18px 4px 16px; border-bottom: 1px solid var(--line); }
  .item:last-of-type { border-bottom: 0; }
  .item.miss { background: var(--warn-soft); border-radius: 10px; padding-left: 12px; padding-right: 12px; }
  .stem { display: flex; gap: 10px; margin-bottom: 14px; font-size: 16px; line-height: 1.55; }
  .stem .n { color: var(--dim); font-size: 13.5px; min-width: 20px; padding-top: 3px; font-variant-numeric: tabular-nums; }

  .opts { display: flex; gap: 6px; }
  .opt { flex: 1 1 0; position: relative; min-width: 0; }
  .opt input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .opt span {
    display: flex; align-items: center; justify-content: center;
    height: 46px; border: 1.5px solid var(--line); border-radius: 10px;
    background: #fff; color: var(--dim); font-size: 15px; font-variant-numeric: tabular-nums;
    transition: background .12s, border-color .12s, color .12s;
  }
  .opt input:hover + span { border-color: #b9c2d0; }
  .opt input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 의미변별 — 양극 라벨이 문항마다 다르므로 문항 안에 둔다 */
  .poles { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 13px; color: var(--dim); }
  .poles span:last-child { text-align: right; }

  /* 선택지형(사전·기본 정보) */
  .choice { display: flex; flex-direction: column; gap: 8px; }
  .choice .opt { flex: none; }
  .choice .opt span {
    height: auto; min-height: 50px; justify-content: flex-start;
    padding: 12px 16px; font-size: 15.5px; color: var(--fg);
  }
  .choice .opt input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* ---------- 아래 고정 막대 ---------- */
  .footbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
    background: rgba(238,241,245,.94); backdrop-filter: blur(8px);
    border-top: 1px solid var(--line); padding: 12px 16px;
  }
  .footbar .inner {
    max-width: 680px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .count { font-size: 13px; color: var(--dim); }
  .count.done { color: var(--ok); }
  button {
    font: inherit; font-size: 16px; color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; padding: 13px 30px; cursor: pointer; min-height: 48px;
  }
  button:hover { background: #1d4ed8; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  button.ghost:hover { background: #e3e8ef; }

  /* ---------- 안내·시작·종료 ---------- */
  .center { text-align: center; padding: 44px 22px; }
  .center .task { font-size: 21px; line-height: 1.65; margin: 6px 0 30px; }
  .center .task.sub { font-size: 17px; color: var(--dim); margin-top: -18px; }
  .required { margin: 0 0 4px; }
  .note { background: var(--warn-soft); border: 1px solid #f2c7a8; color: var(--warn);
          border-radius: 10px; padding: 11px 14px; font-size: 13.5px; margin: 0 0 14px; }
  /* 중단 안내는 눈에 띄어야 한다 — 참여 내내 유효한 권리라서 시작 화면에서 흘려보내면 안 된다 */
  .withdraw { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--fg); }
  .sidbox { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; }
  .sidbox label { display: block; font-size: 14px; margin-bottom: 8px; }
  .sidbox input[type=text] { font-size: 16px; padding: 12px 14px; width: 100%; max-width: 260px; }
  .sidbox .dim { margin: 8px 0 0; }

  /* ---------- 동의서·디브리핑 ----------
     읽으라고 내놓는 글이라 설문 문항보다 줄 간격을 넓히고 글자를 키웠다.
     체크 상자는 손가락으로 누를 자리를 상자 전체로 잡는다 — 네모 하나만 누르게 하면
     자꾸 빗나가고, 빗나간 참가자는 동의를 안 한 것으로 남는다. */
  .doc h3 { font-size: 16px; margin: 24px 0 7px; }
  .doc h3:first-child { margin-top: 6px; }
  .doc p { margin: 0 0 9px; font-size: 15.5px; line-height: 1.72; color: #333a46; }
  .agree { border-top: 1px solid var(--line); margin-top: 26px; padding-top: 20px;
           display: flex; flex-direction: column; gap: 10px; }
  .agree label {
    display: flex; gap: 11px; align-items: flex-start; font-size: 15.5px;
    padding: 13px 15px; border: 1.5px solid var(--line); border-radius: 10px;
    background: #fff; cursor: pointer; min-height: 48px;
  }
  .agree label.on { border-color: var(--accent); background: var(--accent-soft); }
  .agree input { margin: 3px 0 0; flex: none; }
  /* 거절은 동의와 나란히 두지 않는다 — 나란히 두면 오른쪽 큰 버튼을 습관적으로 누른다 */
  .decline { margin-top: 18px; text-align: center; }
  .decline button { font-size: 14.5px; padding: 10px 18px; }
  button:disabled { background: #b9c2d0; cursor: not-allowed; }
  button:disabled:hover { background: #b9c2d0; }
  /* ---------- 조작 연습 ----------
     도형만 쓴다. 광고에 나오는 물건·화면을 쓰면 광고를 미리 보여 주는 셈이 된다. */
  .pr-say { font-size: 17px; font-weight: 600; margin: 18px 0 12px; }
  .pr-hint { min-height: 22px; margin: 12px 0 0; font-size: 13.5px; color: var(--accent); }
  .pr-stage {
    position: relative; height: 300px; overflow: hidden;
    background: #f7f9fc; border: 1px solid var(--line); border-radius: 12px;
    touch-action: none;                 /* 드래그가 화면 스크롤로 새지 않게 */
  }
  .pr-target {
    position: absolute; left: 50%; top: 34px; transform: translateX(-50%);
    width: 132px; height: 96px; border: 2.5px dashed #9fb0c9; border-radius: 12px;
    background: #eef3fb; transition: background .2s, border-color .2s;
  }
  .pr-target.is-in { background: var(--accent-soft); border-color: var(--accent); border-style: solid; }
  .pr-dot {
    position: absolute; width: 68px; height: 68px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 3px 10px rgba(37,99,235,.3);
    cursor: grab; touch-action: none;
  }
  .pr-dot.is-held { cursor: grabbing; transform: scale(1.06); }
  .pr-dot.is-back { transition: left .24s ease, top .24s ease; }   /* 스냅백 — 비난 문구 없음 */
  .pr-dot.is-in { transition: all .3s ease; opacity: .35; }

  .pr-bar { position: absolute; left: 0; right: 0; height: 22px; }
  .pr-bar i { position: absolute; top: 0; height: 22px; background: #cbd5e4; border-radius: 4px; }
  .pr-me {
    position: absolute; height: 46px; border-radius: 10px; background: var(--accent);
    box-shadow: 0 3px 10px rgba(37,99,235,.3);
  }
  .pr-me.is-bump { background: #94a3b8; }      /* 부딪히면 색만 잠깐 바뀐다 — 글자로 나무라지 않는다 */
  .pr-me.is-in { background: var(--ok); }

  .devbox { background: #f4f6f9; border: 1px dashed #c8cfdb; border-radius: 10px; padding: 14px 16px; margin-top: 18px; }
  .devbox .hd { font-size: 12px; color: var(--dim); letter-spacing: .06em; margin-bottom: 10px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .row label { font-size: 13.5px; color: var(--fg); display: flex; align-items: center; gap: 6px; }
  input[type=text] { font: inherit; font-size: 14px; border: 1px solid var(--line);
                     border-radius: 8px; padding: 8px 10px; background: #fff; color: var(--fg); }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); }

  button.mini { font-size: 12.5px; padding: 5px 12px; min-height: 0; }
  table.plan { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.plan th, table.plan td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); }
  table.plan th { color: var(--dim); font-weight: 500; font-size: 12.5px; }

  /* ---------- 자극 ---------- */
  #playWrap { display: none; position: fixed; inset: 0; z-index: 40;
              align-items: center; justify-content: center; background: #0b0d11; }
  #frame { border: 0; background: #000; border-radius: 12px;
           height: min(96vh, 1040px); aspect-ratio: 9 / 16; max-width: 96vw; }
  #escape { position: fixed; right: 12px; bottom: 12px; z-index: 41;
            font-size: 12px; padding: 7px 12px; min-height: 0; opacity: .22;
            background: transparent; color: #fff; border: 1px solid #444; }
  #escape:hover { opacity: 1; background: transparent; }

  pre { background: #f4f6f9; border: 1px solid var(--line); border-radius: 10px;
        padding: 12px; font-size: 12px; max-height: 38vh; overflow: auto; margin: 0 0 14px; }
  .err { color: var(--warn); }

  @media (max-width: 480px) {
    .opts { gap: 4px; }
    .opt span { height: 44px; font-size: 14px; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>

<div id="root"></div>
<div id="playWrap"><iframe id="frame" title="자극"></iframe></div>
<button id="escape" hidden>건너뛰기</button>

<!-- ?v= 는 캐시 깨기용이다. 문구를 고쳤는데 옛 화면이 그대로 나오면 이 숫자를 올린다.
     헤더로 캐시를 꺼도, 이미 열려 있는 화면은 처음 받은 파일로 계속 돈다. -->
<script src="survey.js?v=4"></script>
<script src="practice.js?v=4"></script>
<script>
'use strict';

var S = window.SURVEY;

/* 화면에 뜬 것이 지금 파일인지 옛 파일인지 눈으로 가릴 수 있게 판 번호를 박아 둔다.
 * 연구원 화면에만 보인다. 문구를 고쳤는데 화면이 안 바뀌면 여기부터 확인한다. */
var BUILD = '2026-08-12 · 판 4';

/* ==========================================================
 * 1. 자극과 블록 순서
 * ========================================================== */

var STIMS = {
  laundry: { label: '세탁 광고', path: 'laundry-ad/index.html' },
  // 통합 러너도 dist/ 를 iframe 으로 읽는 게 규격이다
  game:    { label: '게임',     path: 'game/dist/index.html' }
};

/* ---------- 순서 배정 (카운터밸런싱) ----------
 *
 * 4×4 라틴방격. 네 블록이 1~4번째 자리에 각각 정확히 한 번씩 온다.
 *   - 같은 자극이 연달아 나오지 않는다 — "아까 그거 또"가 되면 두 번째 노출이 달라진다.
 *   - 시청 먼저가 2줄, 개입 먼저가 2줄 — 조건 순서도 균형이 잡힌다.
 *
 *          1번째        2번째        3번째        4번째
 *   0   세탁 시청    게임 개입    세탁 개입    게임 시청
 *   1   게임 시청    세탁 개입    게임 개입    세탁 시청
 *   2   세탁 개입    게임 시청    세탁 시청    게임 개입
 *   3   게임 개입    세탁 시청    게임 시청    세탁 개입
 *
 * 여기에 ver 배정을 교차해 8집단이 된다.
 *   0~3집단: 자극별 첫 노출 = A, 두 번째 = B
 *   4~7집단: 자극별 첫 노출 = B, 두 번째 = A
 * 4집단만 쓰면 조건별 ver 균형은 맞지만 ver A 가 늘 첫 노출이 되어, 처음 보는 신선함이
 * 전부 A 에 실린다. 게임 ver B 는 중간 난이도대가 A 보다 후할 가능성이 남아 있어서
 * (60% 정답 정책 A 50% · B 67%) ver 과 노출 순서를 붙여 두면 나중에 떼어낼 수 없다.
 *
 * 표본 수는 8의 배수여야 딱 떨어진다. 집단당 3명 미만이 될 만큼 N 이 작으면
 * ORDERS 만 쓰고 flip 을 끄는 4집단으로 물러서는 편이 낫다.
 */
var ORDERS = [
  [['laundry', 'watch'],     ['game', 'intervene'], ['laundry', 'intervene'], ['game', 'watch']],
  [['game', 'watch'],        ['laundry', 'intervene'], ['game', 'intervene'], ['laundry', 'watch']],
  [['laundry', 'intervene'], ['game', 'watch'],     ['laundry', 'watch'],     ['game', 'intervene']],
  [['game', 'intervene'],    ['laundry', 'watch'],  ['game', 'watch'],        ['laundry', 'intervene']]
];

/* 조작 연습은 광고 흐름 밖으로 나갔다 — 사전 문항 직후 한 번, 모든 참가자에게 같은 자리다.
 * 근거는 practice.js 머리 주석에 적어 뒀다. 게임 자극의 mode=tutorial 은 코드에 그대로 남아
 * 있으나(단독 실행·점검용) 러너는 더 이상 띄우지 않는다. */

/* ==========================================================
 * 2. 상태
 * ========================================================== */

var qs = new URLSearchParams(location.search);
var state = {
  sid: qs.get('sid') || 'preview-' + Math.random().toString(36).slice(2, 8),
  /* 연구원용 화면(블록 순서표·설정·수집 결과)은 ?dev=1 일 때만 나온다.
   * 이 안에는 조건명(watch/intervene)과 ver 이 그대로 적혀 있어서 참가자가 보면
   * 형식 비교 연구라는 것이 드러난다 — 기본값은 반드시 꺼짐이다. */
  dev: qs.get('dev') === '1',
  debug: qs.get('debug') === '1',
  withPractice: qs.get('practice') !== '0',   // 연습 건너뛰기 — 미리보기 전용
  lenient: qs.get('lenient') === '1',   // 미응답 허용 — 미리보기 전용
  group: 0, seq: [], flow: [], step: 0, saved: false, saveError: null,
  declined: false,                      // 동의서에서 참여를 거절함 — 여기서 흐름이 끝난다
  resp: { pre: {}, demo: {}, blocks: {}, attention: {}, consent: null, debrief: {} },
  practice: null,
  logs: [],
  playing: false
};

var root = document.getElementById('root');
var playWrap = document.getElementById('playWrap');
var frame = document.getElementById('frame');
var escapeBtn = document.getElementById('escape');

/* ----------------------------------------------------------
 * 자극의 소리 잠금 풀기
 *
 * 브라우저는 사용자 제스처 없이 소리를 내지 못하게 막는다. 그런데 자극 안에는
 * 시작 버튼이 없고(두 자극 공통 규격), 시청 조건 참가자는 광고를 보는 동안 화면을
 * 한 번도 건드리지 않을 수 있다 — 그러면 그 참가자만 무음으로 광고를 본다.
 *
 * 그래서 **러너가 대신 풀어 준다.** 참가자가 러너에서 버튼을 누르는 순간(=제스처를
 * 들고 있는 순간) 같은 출처의 iframe 안 AudioContext 를 직접 깨운다. 자극이 아직
 * 안 떴으면 자극이 보내는 AD_READY 를 받아 한 번 더 시도한다.
 *
 * 그래도 막히는 브라우저가 있을 수 있어, 실제로 소리가 났는지는 자극이 AUDIO_OK 로
 * 기록한다. 분석에서 "소리를 들은 참가자"를 가려낼 수 있어야 하기 때문이다.
 * ---------------------------------------------------------- */
function unlockFrameAudio() {
  var w = frame.contentWindow;
  if (!w) return;
  // 같은 출처라 직접 부를 수 있다. 이 호출이 제스처 안에서 일어나야 잠금이 풀린다.
  try { if (w.AD_SFX && w.AD_SFX.unlock) w.AD_SFX.unlock(); } catch (e) { /* 아직 로드 전 */ }
  try { w.postMessage({ type: 'AD_UNLOCK' }, '*'); } catch (e) { /* 프레임 없음 */ }
}
// 러너 위에서 일어나는 모든 제스처를 잠금 해제 기회로 쓴다(시작 버튼 클릭 포함)
['pointerdown', 'touchstart', 'keydown'].forEach(function (t) {
  document.addEventListener(t, unlockFrameAudio, true);
});
// 자극이 뜬 직후 — 앞선 클릭의 제스처가 아직 유효한 동안 다시 시도한다
window.addEventListener('message', function (e) {
  if (e && e.data && e.data.type === 'AD_READY') unlockFrameAudio();
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
  });
}
/** 블록 응답을 담는 키 — 순서가 참가자마다 달라도 자극·조건으로 유일하다 */
function blockKey(b) { return b.stim + '_' + b.mode; }

/** 참가자 번호 → 집단(0~7). 무작위가 아니라 순번이다 — 소표본에서 무작위 배정은
 *  오히려 집단이 기울어진다. ?group=N 으로 덮어쓸 수 있다(리허설·재현용). */
function groupOf(sid) {
  var forced = qs.get('group');
  if (forced !== null && forced !== '' && isFinite(Number(forced))) {
    return ((parseInt(forced, 10) % 8) + 8) % 8;
  }
  var digits = String(sid).match(/\d+/g);
  if (digits) {
    var n = parseInt(digits.join(''), 10);      // P001 → 1
    return (((n - 1) % 8) + 8) % 8;             // 1번 참가자 → 0집단
  }
  // 번호가 없는 미리보기용 sid — 글자에서 고르게 흩어지는 값을 만든다
  var h = 0, str = String(sid);
  for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 100000;
  return h % 8;
}

function buildSeq() {
  var order = ORDERS[state.group % 4];
  var flip = state.group >= 4;                  // 자극별 첫 노출을 B 로 시작하는 배정
  var seen = {};
  return order.map(function (pair, i) {
    var stim = pair[0], first = !seen[stim];
    seen[stim] = true;
    /* 자극 하나를 두 번 겪으므로 두 번째는 반드시 다른 ver 이어야 한다 */
    return { stim: stim, mode: pair[1], ver: (first !== flip) ? 'A' : 'B', block: i + 1 };
  });
}

/** 화면 목록 — 동의서 → 사전 → 연습 → (안내 → 자극 → 설문 6쪽 → 휴식) × 4
 *  → 기본 정보 → 디브리핑 → 종료
 *
 *  동의서는 맨 앞이다. 사전 문항이라도 동의 전에 받으면 그건 동의 없이 받은 자료다.
 *  디브리핑은 마지막 문항 뒤다. 앞에 두면 목적을 알고 답한 자료가 되어 쓸 수 없다. */
function buildFlow() {
  var f = [{ kind: 'consent' }, { kind: 'pre' }];
  if (state.withPractice) f.push({ kind: 'practice' });
  var last = realBlocks().length;
  state.seq.forEach(function (b) {
    f.push({ kind: 'intro', b: b });
    f.push({ kind: 'play', b: b });
    S.BLOCK_PAGES.forEach(function (pg, i) {
      f.push({
        kind: 'survey', b: b, page: pg,
        // 응답 확인은 지정된 블록의 마지막 쪽 끝에 붙는다
        attention: (i === S.BLOCK_PAGES.length - 1) && S.ATTENTION_BLOCKS.indexOf(b.block) >= 0
      });
    });
    // 광고 사이에만 휴식을 둔다. 마지막 광고 뒤는 기본 정보 두 문항이라 붙일 자리가 아니다.
    if (b.block < last) f.push({ kind: 'break', b: b });
  });
  f.push({ kind: 'demo' });
  f.push({ kind: 'debrief' });
  f.push({ kind: 'end' });
  return f;
}

function realBlocks() { return state.seq; }

/** 자극 URL — 러너 → 자극 파라미터 (INTEGRATION.md §1) */
function urlFor(b) {
  var u = STIMS[b.stim].path + '?mode=' + b.mode + '&ver=' + b.ver +
          '&sid=' + encodeURIComponent(state.sid);
  if (b.block) u += '&block=' + b.block;
  if (state.debug) u += '&debug=1';
  return u;
}

/* ==========================================================
 * 3. 문항 렌더
 *
 * 문항 하나 = .item 한 덩어리. 행렬형을 쓰지 않는 이유는 파일 머리 주석에 적어 뒀다.
 * 라디오 input 은 그대로 두고(키보드·접근성) 눈에 보이는 것만 span 으로 그린다.
 * ========================================================== */

function optButtons(item, scope, value) {
  var out = '';
  for (var v = 1; v <= item.scale; v++) {
    out += '<label class="opt">' +
      '<input type="radio" name="' + scope + '__' + item.id + '" value="' + v + '"' +
        (String(value) === String(v) ? ' checked' : '') + '>' +
      '<span>' + v + '</span></label>';
  }
  return '<div class="opts">' + out + '</div>';
}

/* stim — 광고된 제품군('game' 이면 게임, 그 밖에는 비게임). 섹션 E 세 문항은
 * 여기에 따라 대상 명사가 바뀐다(survey.js 의 stemBy). 나머지 문항은 영향이 없다. */
function renderItem(item, no, scope, value, stim) {
  var body;
  if (item.type === 'sd') {
    // 양극 라벨은 문항마다 다르므로 눈금 바로 아래에 붙인다
    body = optButtons(item, scope, value) +
      '<div class="poles"><span>' + esc(item.poles[0]) + '</span>' +
      '<span>' + esc(item.poles[1]) + '</span></div>';
  } else if (item.type === 'choice') {
    var opts = item.options.map(function (o, i) {
      var v = i + 1;
      return '<label class="opt"><input type="radio" name="' + scope + '__' + item.id + '"' +
        ' value="' + v + '"' + (String(value) === String(v) ? ' checked' : '') + '>' +
        '<span>' + esc(o) + '</span></label>';
    }).join('');
    body = '<div class="choice">' + opts + '</div>';
  } else {
    body = optButtons(item, scope, value);
    // 눈금 라벨이 기본(동의형)과 다른 문항용. 화면 위 고정 라벨은 한 페이지에 한 벌뿐이라
    // 그런 문항을 대신해 주지 못하므로, 의미변별의 양극 라벨과 같은 자리에 문항마다 붙인다.
    // 정본에는 지금 해당 문항이 없다 — 사전 노출 빈도 문항이 구간 선택으로 바뀌면서 없어졌다.
    if (item.ticks && item.ticks !== S.LIKERT_TICKS) {
      body += '<div class="poles"><span>' + esc(item.ticks[1]) + '</span>' +
        '<span>' + esc(item.ticks[item.scale]) + '</span></div>';
    }
  }

  var text = S.stemFor(item, stim);
  var stem = text
    ? '<div class="stem"><span class="n">' + no + '</span><span>' + esc(text) + '</span></div>'
    : '<div class="stem"><span class="n">' + no + '</span></div>';

  return '<div class="item" data-item="' + item.id + '">' + stem + body + '</div>';
}

function renderItems(items, scope, store, startNo, stim) {
  return items.map(function (it, i) {
    return renderItem(it, startNo + i, scope, store[it.id], stim);
  }).join('');
}

/** 동의형 눈금 라벨 — 화면 위에 고정해 스크롤해도 보이게 한다 */
function legendFor(items) {
  if (!items.length || items[0].type !== 'likert') return '';
  var t = items[0].ticks || S.LIKERT_TICKS;
  return '<div class="legend"><span><b>1</b> ' + esc(t[1]) + '</span>' +
    (t[4] ? '<span><b>4</b> ' + esc(t[4]) + '</span>' : '') +
    '<span><b>' + items[0].scale + '</b> ' + esc(t[items[0].scale]) + '</span></div>';
}

/** 화면에 그려진 문항 중 미응답인 것의 id 목록 */
function unanswered(scope, items) {
  return items.filter(function (it) {
    return !document.querySelector('input[name="' + scope + '__' + it.id + '"]:checked');
  }).map(function (it) { return it.id; });
}

/** 화면의 응답을 store 에 거둔다 */
function collect(scope, items, store) {
  items.forEach(function (it) {
    var el = document.querySelector('input[name="' + scope + '__' + it.id + '"]:checked');
    store[it.id] = el ? Number(el.value) : null;
  });
}

function markMissing(ids) {
  ids.forEach(function (id) {
    var el = document.querySelector('[data-item="' + id + '"]');
    if (el) el.classList.add('miss');
  });
  var first = document.querySelector('[data-item="' + ids[0] + '"]');
  if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ==========================================================
 * 4. 화면 뼈대
 * ========================================================== */

function chrome(crumb, pct, body, footLeft, footBtn) {
  return '<div class="topbar"><div class="inner">' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="crumb">' + esc(crumb) + '</div>' +
    '</div></div>' +
    '<div class="wrap">' + body + '</div>' +
    '<div class="footbar"><div class="inner">' +
      '<span class="count" id="count">' + (footLeft || '') + '</span>' +
      '<button id="next">' + (footBtn || '다음') + '</button>' +
    '</div></div>';
}

/** 응답 개수 표시를 갱신하고, 라디오를 누를 때마다 미응답 표시를 지운다 */
function wireCounter(scope, items) {
  var el = document.getElementById('count');
  function update() {
    var left = unanswered(scope, items).length;
    el.textContent = left ? (items.length - left) + ' / ' + items.length + ' 응답'
                          : '모두 응답했습니다';
    el.className = 'count' + (left ? '' : ' done');
  }
  document.querySelectorAll('.wrap input[type=radio]').forEach(function (r) {
    r.addEventListener('change', function () {
      var host = r.closest('[data-item]');
      if (host) host.classList.remove('miss');
      update();
    });
  });
  update();
}

function bindNext(guard) {
  document.getElementById('next').onclick = function () {
    if (guard() === false) return;
    state.step++;
    render();
  };
}

function progressPct() {
  return Math.round((state.step / Math.max(1, state.flow.length - 1)) * 100);
}

/* 진행 표시 — 123문항의 부담을 줄이는 최소 장치다. 어디까지 왔는지만 말하고
 * 자극 이름·조건은 넣지 않는다. */
function crumbFor(s) {
  if (s.kind === 'consent') return '연구 참여 동의';
  if (s.kind === 'debrief') return '연구에 대한 설명';
  if (s.kind === 'pre') return '사전 문항';
  if (s.kind === 'demo') return '기본 정보';
  if (s.kind === 'break') return '휴식';
  if (s.kind === 'practice') return '조작 연습';
  if (!s.b) return '';
  var base = s.b.block + ' / ' + realBlocks().length + '번째 광고';
  return s.kind === 'survey' ? base + ' · 설문' : base;
}

/* ==========================================================
 * 5. 각 화면
 * ========================================================== */

function showStart(warning) {
  state.playing = false;
  playWrap.style.display = 'none';
  escapeBtn.hidden = true;

  var rows = state.seq.map(function (b) {
    return '<tr><td>' + b.block + '</td>' +
      '<td>' + STIMS[b.stim].label + '</td>' +
      '<td class="mono">' + b.mode + '</td>' +
      '<td class="mono">' + b.ver + '</td>' +
      '<td class="dim">설문 29' +
        (S.ATTENTION_BLOCKS.indexOf(b.block) >= 0 ? ' + 응답확인' : '') + '</td></tr>';
  }).join('');

  var errs = S.validate();

  /* 연구원용 — 조건명(watch/intervene)·ver·문항 점검이 들어 있어 참가자에게 보이면 안 된다 */
  var devPanel = !state.dev ? '' :
      '<div class="card">' +
        '<h2 class="dim">연구원 화면 — 참가자에게 보이지 않습니다</h2>' +
        '<p class="dim">화면 판 <span class="mono">' + BUILD + '</span> · ' +
          '사전 문항 ' + S.PRE.length + '개 · 총 ' + S.TOTAL_ITEMS + '문항</p>' +
        '<p class="dim">미리보기 러너입니다. 동의서·디브리핑은 들어 있고, ' +
          '통합 러너(session.html)가 아니므로 수집 서버 전송은 아직 없습니다 — ' +
          '자료는 이 브라우저에만 쌓입니다.</p>' +
        (errs.length ? '<p class="note">설문 문항 점검 — ' + errs.map(esc).join(' / ') + '</p>' : '') +
        '<p class="dim">식별 번호 <span class="mono">' + esc(state.sid) + '</span> → ' +
          '<b>' + state.group + '집단</b> ' +
          '(순서 ' + (state.group % 4) + ' · 첫 노출 ver ' + (state.group >= 4 ? 'B' : 'A') + '). ' +
          '식별 번호를 고치고 칸 밖을 누르면 다시 배정됩니다.</p>' +
        '<table class="plan"><thead><tr><th>블록</th><th>자극</th><th>조건</th>' +
          '<th>ver</th><th>직후</th></tr></thead><tbody>' + rows + '</tbody></table>' +
        collectionBox() +
        '<div class="devbox"><div class="hd">미리보기 설정</div>' +
          '<div class="row">' +
            '<label><input type="checkbox" id="tut"' + (state.withPractice ? ' checked' : '') + '> 조작 연습 포함</label>' +
            '<label><input type="checkbox" id="dbg"' + (state.debug ? ' checked' : '') + '> 자극 debug 패널</label>' +
            '<label><input type="checkbox" id="len"' + (state.lenient ? ' checked' : '') + '> 미응답 허용</label>' +
          '</div></div>' +
      '</div>';

  root.innerHTML = '<div class="wrap"><div class="card">' +
      '<h1>' + esc(S.STUDY_TITLE) + '</h1>' +
      '<p class="lead">' + esc(S.SUMMARY_TEXT) + '</p>' +
      '<p class="lead">' + esc(S.STRUCTURE_TEXT) + '</p>' +
      '<p class="lead withdraw">' + esc(S.WITHDRAW_TEXT) + '</p>' +
      (warning ? '<p class="note">' + warning + '</p>' : '') +
      '<div class="sidbox">' +
        '<label for="sid">' + esc(S.SID_LABEL) + '</label>' +
        '<input type="text" id="sid" value="' + esc(state.sid) + '" size="16" ' +
          'autocomplete="off" inputmode="text">' +
        '<p class="dim">' + esc(S.SID_HELP) + '</p>' +
      '</div>' +
    '</div>' + devPanel + '</div>' +
    '<div class="footbar"><div class="inner"><span class="count"></span>' +
      '<button id="next">시작</button></div></div>';

  if (state.dev) {
    wireCollection();
    document.getElementById('tut').onchange = function (e) {
      state.withPractice = e.target.checked;
      showStart(warning);
    };
    /* 연구원이 번호를 바꿔 가며 집단별 순서를 확인할 수 있게 한다.
     * change 는 칸에서 빠져나올 때 한 번만 울려서, 글자를 칠 때마다 다시 그리지 않는다. */
    document.getElementById('sid').onchange = function (e) {
      state.sid = e.target.value.trim() || state.sid;
      state.group = groupOf(state.sid);
      state.seq = buildSeq();
      showStart(warning);
    };
    document.getElementById('dbg').onchange = function (e) { state.debug = e.target.checked; };
    document.getElementById('len').onchange = function (e) { state.lenient = e.target.checked; };
  }
  document.getElementById('next').onclick = function () {
    state.sid = document.getElementById('sid').value.trim() || state.sid;
    state.group = groupOf(state.sid);       // 식별 번호가 바뀌면 순서도 바뀐다
    state.seq = buildSeq();
    state.resp = { pre: {}, demo: {}, blocks: {}, attention: {}, consent: null, debrief: {} };
    state.practice = null;
    state.saved = false;
    state.saveError = null;
    state.declined = false;
    state.logs = [];
    state.flow = buildFlow();
    state.step = 0;
    render();
  };
}

/** 수집함 — 이 브라우저에 쌓인 응답을 연구원이 꺼내 가는 곳 */
function collectionBox() {
  var runs = loadRuns();
  if (!runs.length) {
    return '<div class="devbox"><div class="hd">수집함</div>' +
      '<p class="dim">아직 끝까지 마친 응답이 없습니다. 참가자가 종료 화면에 닿으면 ' +
      '이 브라우저에 자동으로 쌓입니다.</p></div>';
  }
  var rows = runs.map(function (r, i) {
    /* 자료 사용을 거절한 참여는 눈에 띄어야 한다 — 응답이 없는 줄인 줄 모르고
     * 결측으로 오해하면 안 된다. 참여자 수에는 세지만 분석에는 못 쓴다. */
    var gone = r.bundle && r.bundle.withdrawn;
    return '<tr><td>' + (i + 1) + '</td>' +
      '<td class="mono">' + esc(r.sid) + (gone ? ' <span class="dim">· 자료 사용 거절</span>' : '') + '</td>' +
      '<td>' + r.group + '집단</td>' +
      '<td class="dim">' + esc(String(r.at).replace('T', ' ').slice(0, 16)) + '</td>' +
      '<td><button class="ghost mini" data-csv="' + i + '">CSV</button> ' +
          '<button class="ghost mini" data-run="' + i + '">JSON</button></td></tr>';
  }).join('');
  return '<div class="devbox"><div class="hd">수집함 — ' + runs.length + '명분</div>' +
    '<table class="plan"><thead><tr><th>#</th><th>식별 번호</th><th>집단</th>' +
      '<th>마친 시각</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="row" style="margin-top:12px">' +
      '<button id="allcsv">전체 CSV 내려받기</button>' +
      '<button id="alljson" class="ghost">전체 JSON</button>' +
      '<button id="clear" class="ghost">수집함 비우기</button>' +
    '</div></div>';
}

function wireCollection() {
  var runs = loadRuns();
  /* 수집함에 쌓인 시각(r.at)을 파일 이름에 쓴다 — 같은 식별 번호가 두 줄이면 이름이 겹친다 */
  var stemOf = function (r) {
    return 'preview_' + String(r.sid).replace(/[^\w.-]/g, '_') + '_' +
           String(r.at).replace(/[-:]/g, '').slice(0, 13).replace('T', '-');
  };
  document.querySelectorAll('[data-run]').forEach(function (b) {
    b.onclick = function () {
      var r = runs[Number(b.dataset.run)];
      download(stemOf(r) + '.json', JSON.stringify(r.bundle, null, 1), 'application/json');
    };
  });
  document.querySelectorAll('[data-csv]').forEach(function (b) {
    b.onclick = function () {
      var r = runs[Number(b.dataset.csv)];
      download(stemOf(r) + '.csv', toCsv([r.row]), 'text/csv');
    };
  });
  var csv = document.getElementById('allcsv');
  if (!csv) return;
  csv.onclick = function () {
    /* 한 사람 한 줄. 순서가 사람마다 달라 열 구성이 조금씩 다른데,
     * toCsv 가 모든 행의 열을 합집합으로 모아 빈 칸을 채운다. */
    download('preview_all.csv', toCsv(runs.map(function (r) { return r.row; })), 'text/csv');
  };
  document.getElementById('alljson').onclick = function () {
    download('preview_all.json', JSON.stringify(runs, null, 1), 'application/json');
  };
  document.getElementById('clear').onclick = function () {
    if (!confirm('수집함을 비웁니다. 내려받지 않은 응답은 사라집니다. 계속할까요?')) return;
    localStorage.removeItem(RUNS_KEY);
    showStart();
  };
}

function render() {
  var s = state.flow[state.step];
  state.playing = false;
  playWrap.style.display = 'none';
  escapeBtn.hidden = true;
  window.scrollTo(0, 0);

  if (s.kind === 'play') return play(s);
  if (s.kind === 'break') return showBreak(s);
  if (s.kind === 'practice') return showPractice(s);
  if (s.kind === 'consent') return showConsent(s);
  if (s.kind === 'debrief') return showDebrief(s);
  if (s.kind === 'end') return showEnd();
  if (s.kind === 'pre')  return showItemPage(s, S.PRE, 'pre', state.resp.pre, S.PRE_INSTRUCTION, 1);
  if (s.kind === 'demo') return showItemPage(s, S.DEMO, 'demo', state.resp.demo, S.DEMO_INSTRUCTION, 1);
  if (s.kind === 'intro') return showIntro(s);
  return showSurvey(s);
}

/** 동의서·디브리핑 본문 — {h, p[]} 목록을 그대로 그린다 */
function docSections(sections) {
  return '<div class="doc">' + sections.map(function (sec) {
    return '<h3>' + esc(sec.h) + '</h3>' +
      sec.p.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('');
  }).join('') + '</div>';
}

/* 연구 참여 동의서.
 *
 * '다음' 버튼은 세 항목에 모두 체크하기 전까지 눌리지 않는다. 미응답 문항처럼 빨갛게
 * 표시했다가 통과시키는 방식(state.lenient)을 여기에는 쓰지 않는다 — 설문 문항은 빠져도
 * 결측 하나지만, 동의는 빠지면 동의 없이 받은 자료가 된다.
 *
 * 거절 단추를 실제로 두는 이유: 거절할 자리가 화면에 없으면 그만두는 방법이 "연구원을
 * 불러 세우는 것"뿐이고, 그건 자발적 참여가 아니라 눈치의 문제가 된다. */
function showConsent(s) {
  var C = S.CONSENT;
  var checks = C.checks.map(function (c) {
    return '<label data-check="' + c.id + '"><input type="checkbox" id="ck_' + c.id + '">' +
      '<span>' + esc(c.label) + '</span></label>';
  }).join('');

  var body = '<div class="card">' +
      '<h1>' + esc(C.title) + '</h1>' +
      '<p class="lead">' + esc(C.lead) + '</p>' +
      docSections(C.sections) +
      '<div class="agree">' + checks + '</div>' +
      '<div class="decline"><button class="ghost" id="decline">' + esc(C.decline) + '</button></div>' +
    '</div>';

  root.innerHTML = chrome(crumbFor(s), progressPct(), body, '', C.agree);

  var btn = document.getElementById('next');
  var count = document.getElementById('count');
  var boxes = C.checks.map(function (c) { return document.getElementById('ck_' + c.id); });

  function update() {
    var all = boxes.every(function (b) { return b.checked; });
    btn.disabled = !all;
    count.textContent = all ? '' : C.pending;
    boxes.forEach(function (b) {
      b.closest('[data-check]').classList.toggle('on', b.checked);
    });
  }
  boxes.forEach(function (b) { b.onchange = update; });
  update();

  btn.onclick = function () {
    if (btn.disabled) return;
    /* 무엇에 언제 동의했는지를 항목별로 남긴다. 한 칸에 1 만 남기면 나중에
     * "연령 확인은 받았나"를 자료로 답할 수 없다. */
    state.resp.consent = { at: Date.now(), agreed: 1 };
    C.checks.forEach(function (c) { state.resp.consent[c.id] = 1; });
    state.step++;
    render();
  };
  document.getElementById('decline').onclick = function () { showDeclined(); };
}

/** 동의하지 않음 — 여기서 끝난다. 아무것도 저장하지 않는다 */
function showDeclined() {
  state.declined = true;
  root.innerHTML = '<div class="wrap"><div class="card center">' +
      '<h1>' + esc(S.CONSENT.declinedTitle) + '</h1>' +
      '<p class="task">' + esc(S.CONSENT.declinedText) + '</p>' +
    '</div></div>';
}

/* 디브리핑 — 동의서에서 미뤄 둔 설명을 갚는 자리.
 *
 * 마지막 문항 뒤, 종료 화면 앞이다. 자료 사용 재동의는 여기서 받는다. 설명을 읽기 전에
 * 물으면 "목적을 알고 난 뒤의 판단"이 아니라서 물어본 의미가 없다. */
function showDebrief(s) {
  var D = S.DEBRIEF, q = S.DEBRIEF_WITHDRAW;
  var body = '<div class="card">' +
      '<h1>' + esc(D.title) + '</h1>' +
      '<p class="lead">' + esc(D.lead) + '</p>' +
      docSections(D.sections) +
    '</div>' +
    '<div class="card">' +
      renderItem(q, '', 'debrief', state.resp.debrief[q.id]) +
    '</div>';

  root.innerHTML = chrome(crumbFor(s), progressPct(), body, '', '제출');
  /* 문항이 하나뿐이라 "0 / 1 응답" 세는 것은 소음이다. 미응답 표시만 지워 준다 */
  document.querySelectorAll('.wrap input[type=radio]').forEach(function (r) {
    r.addEventListener('change', function () {
      var host = r.closest('[data-item]');
      if (host) host.classList.remove('miss');
    });
  });
  bindNext(function () {
    /* 이 문항은 lenient 로도 건너뛰지 못한다 — 안 고른 것을 "써도 좋다"로 읽으면 안 된다 */
    if (unanswered('debrief', [q]).length) return markMissing([q.id]), false;
    collect('debrief', [q], state.resp.debrief);
    return true;
  });
}

/** 참가자가 디브리핑에서 자료 사용에 동의하지 않았는가 */
function withdrew() {
  return Number(state.resp.debrief[S.DEBRIEF_WITHDRAW.id]) === S.WITHDRAW_VALUE;
}

/** 사전 문항·기본 정보 — 선택지형 한 쪽 */
function showItemPage(s, items, scope, store, instruction, startNo) {
  var body = '<div class="card"><p class="lead">' + esc(instruction) + '</p>' +
    '<p class="dim required">' + esc(S.REQUIRED_NOTE) + '</p>' +
    renderItems(items, scope, store, startNo) + '</div>';
  root.innerHTML = chrome(crumbFor(s), progressPct(), body);
  wireCounter(scope, items);
  bindNext(function () {
    var miss = state.lenient ? [] : unanswered(scope, items);
    if (miss.length) return markMissing(miss), false;
    collect(scope, items, store);
    return true;
  });
}

function showIntro(s) {
  /* 화면 안내에 조건 이름은 절대 넣지 않는다 — '시청형/개입형', '조건', '실험' 같은 말이 뜨면
   * 참가자가 형식 비교 연구임을 알아채고 포괄 고지 설계가 무너진다. 자극 이름도 넣지 않는다.
   * 조작이 있는 조건에만 "무엇을 하면 되는지" 한 줄이 더 붙는다(조건명이 아니라 행동 안내다). */
  var text = S.BEFORE_AD;
  var extra = s.b.mode === 'intervene' ? S.BEFORE_AD_INTERVENE : '';
  var body = '<div class="card center"><p class="task">' + esc(text) + '</p>' +
    (extra ? '<p class="task sub">' + esc(extra) + '</p>' : '') + '</div>';
  root.innerHTML = chrome(crumbFor(s), progressPct(), body, '', '시작');
  bindNext(function () { return true; });
}

/** 조작 연습 — 두 조작을 다 해내면 스스로 다음으로 넘어간다.
 *  '다음' 버튼을 두지 않는다. 버튼이 있으면 연습을 안 하고 넘어갈 수 있고,
 *  그러면 조작을 못 익힌 참가자가 개입 조건에 들어간다. 8초 무조작이면 안내가 뜬다. */
function showPractice(s) {
  root.innerHTML = chrome(crumbFor(s), progressPct(), '<div id="prHost"></div>', '', '');
  document.querySelector('.footbar').remove();
  window.PRACTICE.mount(document.getElementById('prHost'), function (log) {
    state.practice = log;
    state.step++;
    render();
  });
}

/** 광고와 광고 사이 휴식 — 참가자가 다음을 누를 때까지 아무것도 진행되지 않는다 */
function showBreak(s) {
  var body = '<div class="card center"><p class="task">' + esc(S.BREAK_TEXT) + '</p></div>';
  root.innerHTML = chrome(crumbFor(s), progressPct(), body, '', '다음');
  bindNext(function () { return true; });
}

function showSurvey(s) {
  var b = s.b, pg = s.page, key = blockKey(b);
  var store = state.resp.blocks[key] || (state.resp.blocks[key] = {});
  var scope = key + '_' + pg.key;

  // 문항 번호는 블록 안에서 1..29 로 이어진다
  var startNo = 1;
  for (var i = 0; i < S.BLOCK_PAGES.length && S.BLOCK_PAGES[i].key !== pg.key; i++) {
    startNo += S.BLOCK_PAGES[i].items.length;
  }

  var items = pg.items.slice();
  if (s.attention) items.push(S.ATTENTION);

  var isFirstPage = S.BLOCK_PAGES[0].key === pg.key;
  var body = '<div class="card">' +
    (isFirstPage ? '<p class="lead">' + esc(S.AFTER_AD) + '</p>' : '') +
    '<h2>' + esc(pg.title) + '</h2>' +
    (pg.instruction ? '<p class="dim">' + pg.instruction + '</p>' : '') +
    '<p class="dim required">' + esc(S.REQUIRED_NOTE) + '</p>' +
    legendFor(items) +
    renderItems(items, scope, store, startNo, b.stim) +
    '</div>';

  // 섹션 문자(A~F)는 연구원이 쪽을 짚을 때만 쓴다 — 참가자에게는 뜻이 없다
  root.innerHTML = chrome(crumbFor(s) + (state.dev ? ' · ' + pg.key : ''), progressPct(), body);
  wireCounter(scope, items);

  bindNext(function () {
    var miss = state.lenient ? [] : unanswered(scope, items);
    if (miss.length) return markMissing(miss), false;
    collect(scope, items, store);
    if (s.attention) {
      // 응답 확인은 29문항에 섞지 않고 따로 보관한다
      state.resp.attention['b' + b.block] = store[S.ATTENTION.id];
      delete store[S.ATTENTION.id];
    }
    return true;
  });
}

function play(s) {
  var b = s.b;
  root.innerHTML = '';
  playWrap.style.display = 'flex';
  state.playing = true;
  b._t0 = Date.now();
  frame.src = urlFor(b);

  /* 자극이 AD_DONE 을 못 보내고 멈출 때를 위한 탈출구 — 연구원용이다.
   * 참가자 화면에 두면 광고를 건너뛸 수 있는 버튼이 되어 노출 시간이 조건이 아니라
   * 참가자 선택으로 갈린다. 이렇게 넘어간 블록은 로그에 manual_skip 으로 남는다. */
  escapeBtn.hidden = !state.dev;
  escapeBtn.onclick = function () {
    if (!state.playing) return;
    record(null, 'manual_skip');
    state.playing = false;
    state.step++;
    render();
  };
}

/* 자료가 남는 것은 내려받기 단추와 무관하다 — 종료 화면에 닿는 즉시 이 브라우저에 저장한다.
 * 누가 단추를 안 눌러도, 브라우저를 그냥 닫아도 응답은 수집함에 남아 있다.
 * 종료 화면의 내려받기는 지금 바로 꺼내는 지름길이고, 나중에 꺼내는 정식 경로는
 * 연구원 화면(?dev=1)의 수집함이다. 이 둘을 헷갈리면 안 된다. */
var RUNS_KEY = 'preview_runs';

function loadRuns() {
  try { return JSON.parse(localStorage.getItem(RUNS_KEY) || '[]'); }
  catch (e) { return []; }
}

function saveRun(bundle, row) {
  var runs = loadRuns();
  runs.push({ at: new Date().toISOString(), sid: bundle.sid, group: bundle.group,
              bundle: bundle, row: row });
  try {
    localStorage.setItem(RUNS_KEY, JSON.stringify(runs));
    return null;
  } catch (e) {
    return '저장 공간이 가득 찼습니다 — 연구원 화면에서 내려받고 비워 주세요.';
  }
}

function showEnd() {
  playWrap.style.display = 'none';
  escapeBtn.hidden = true;
  frame.src = 'about:blank';

  var gone = withdrew();
  var bundle = gone ? withdrawnBundle() : exportBundle();
  var row = gone ? withdrawnRow()[0] : flatRow()[0];
  var json = JSON.stringify(bundle, null, 1);

  /* 한 번만 저장한다 — 화면이 다시 그려져도 같은 응답이 두 줄로 쌓이면 안 된다 */
  if (!state.saved) {
    state.saved = true;
    state.saveError = saveRun(bundle, row);
  }

  /* 원자료 덤프와 응답 확인 통과 여부는 연구원 화면에만 둔다.
   * 응답 확인이 주의 점검이었다는 사실이 참가자에게 드러나면 다음 참가자에게 새어 나가고,
   * 그 문항은 기능을 잃는다. */
  var devPanel = !state.dev ? '' :
      '<div class="devbox"><div class="hd">연구원 — 수집 결과</div>' +
        '<p class="dim">sid <span class="mono">' + esc(state.sid) + '</span> · ' +
          '자극 로그 ' + state.logs.length + '건 · 응답 확인 ' + attentionReport() + '</p>' +
        '<pre>' + esc(json) + '</pre>' +
      '</div>';

  /* 내려받기 단추는 두 화면 모두에 둔다. 저장 자체는 이미 끝났으므로(saveRun) 이 단추를
   * 아무도 안 눌러도 자료는 남는다 — 단추는 '지금 바로 꺼내는' 지름길일 뿐이고,
   * 나중에 꺼내는 정식 경로는 연구원 화면(?dev=1)의 수집함이다.
   * 참가자 화면에서는 문구만 중립적으로 두고 내용(원자료·조건명)은 보여 주지 않는다. */
  var saveRow =
      '<div class="row"' + (state.dev ? '' : ' style="justify-content:center"') + '>' +
        '<button id="csv">CSV 내려받기</button>' +
        '<button id="dl" class="ghost">JSON 내려받기</button>' +
        (state.dev ? '<button id="again" class="ghost">처음으로</button>' : '') +
      '</div>';

  root.innerHTML = chrome('종료', 100,
    '<div class="card' + (state.dev ? '' : ' center') + '">' +
      '<p class="task">' + esc(gone ? S.WITHDRAW_ACK : S.CLOSING) + '</p>' +
      (state.saveError ? '<p class="note">' + esc(state.saveError) + '</p>' : '') +
      (gone && state.dev ? '<p class="note">자료 사용 거절 — 응답은 저장하지 않았습니다. ' +
        '수집함에는 참여 사실과 거절 표시만 남습니다.</p>' : '') +
      devPanel +
      saveRow +
    '</div>', '', '');

  document.querySelector('.footbar').remove();
  document.getElementById('dl').onclick = function () {
    download(fileStem() + '.json', json, 'application/json');
  };
  document.getElementById('csv').onclick = function () {
    download(fileStem() + '.csv', toCsv([row]), 'text/csv');
  };
  if (state.dev) document.getElementById('again').onclick = function () { showStart(); };
}

/* 파일 이름 — 같은 식별 번호로 두 번 돌리면 앞 파일이 덮이지 않게 마친 시각을 붙인다.
 * 로컬 시각 기준(YYYYMMDD-HHMM). 파일 이름에 못 쓰는 글자는 없애 둔다. */
function fileStem() {
  var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
  var stamp = d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
              '-' + p(d.getHours()) + p(d.getMinutes());
  return 'preview_' + String(state.sid).replace(/[^\w.-]/g, '_') + '_' + stamp;
}

function attentionReport() {
  return S.ATTENTION_BLOCKS.map(function (n) {
    var v = state.resp.attention['b' + n];
    if (v === undefined || v === null) return '광고' + n + ' 미응답';
    return '광고' + n + ' ' + (v === S.ATTENTION.expect ? '통과' : '실패(' + v + ')');
  }).join(' · ');
}

/* ==========================================================
 * 6. 자극 로그 수신
 * ========================================================== */

/** 자극이 보낸 payload 를 러너가 아는 값으로 보강해 담는다 */
function record(payload, note) {
  var b = state.flow[state.step].b;
  var row = Object.assign({}, payload || {});
  // laundry-ad 는 아직 block 을 읽지 않아 payload 에 없다 (INTEGRATION.md §2 미해결)
  row.sid = state.sid;
  row.block = b.block;
  if (!row.stim) row.stim = b.stim;
  if (!row.mode) row.mode = b.mode;
  if (!row.ver) row.ver = b.ver;
  row.runner_wall_s = Math.round((Date.now() - b._t0) / 100) / 10;
  if (note) row.runner_note = note;
  state.logs.push(row);
}

window.addEventListener('message', function (e) {
  if (!state.playing) return;
  // 앞 블록의 iframe 이 뒤늦게 보낸 메시지를 받지 않도록 발신자를 확인한다
  if (e.source !== frame.contentWindow) return;
  if (!e.data || e.data.type !== 'AD_DONE') return;
  record(e.data.payload, null);
  state.playing = false;
  state.step++;
  render();
});

/* ==========================================================
 * 7. 내보내기
 * ========================================================== */

/* 자료 사용을 거절한 참가자 — 동의서에서 "사용하지 않고 폐기한다"고 약속했으므로
 * 응답을 내보내지도, 저장하지도 않는다. 대신 참여가 있었다는 사실과 거절했다는 사실만
 * 남긴다. 이것마저 지우면 연구원이 "몇 명이 왔고 몇 명이 빠졌는지"를 셀 수 없고,
 * 그 숫자는 논문에 반드시 적어야 하는 것이다. */
function withdrawnBundle() {
  return {
    sid: state.sid, group: state.group, withdrawn: 1,
    consent: state.resp.consent,
    note: '참가자가 디브리핑 후 자료 사용에 동의하지 않아 응답을 저장하지 않았다'
  };
}

function withdrawnRow() {
  return [{ sid: state.sid, 집단: state.group, 자료사용거절: 1 }];
}

function exportBundle() {
  var subs = {};
  Object.keys(state.resp.blocks).forEach(function (k) {
    subs[k] = {};
    S.SUBSCALES.forEach(function (sc) {
      subs[k][sc.key] = S.subscaleMean(sc.key, state.resp.blocks[k]);
    });
  });
  return {
    sid: state.sid,
    group: state.group,
    order: realBlocks().map(function (b) { return blockKey(b) + ':' + b.ver; }),
    withdrawn: 0,
    consent: state.resp.consent,
    debrief: state.resp.debrief,
    pre: state.resp.pre,
    practice: state.practice,
    blocks: state.resp.blocks,
    subscales: subs,
    attention: state.resp.attention,
    demo: state.resp.demo,
    stim_logs: state.logs
  };
}

/** 분석용 1행(wide) — 열 이름은 <자극>_<조건>_<문항id> */
function flatRow() {
  var r = { sid: state.sid, 집단: state.group, order: realBlocks().map(blockKey).join('>') };
  r['자료사용거절'] = 0;
  /* 동의 기록 — 항목별로 남긴다. 동의 시각은 초 단위까지만(분석에 쓸 값이 아니라 기록이다) */
  var cs = state.resp.consent || {};
  r['동의_시각'] = cs.at ? new Date(cs.at).toISOString().slice(0, 19).replace('T', ' ') : null;
  S.CONSENT.checks.forEach(function (c) { r[c.id] = cs[c.id] || null; });
  r[S.DEBRIEF_WITHDRAW.id] = state.resp.debrief[S.DEBRIEF_WITHDRAW.id];
  Object.keys(state.resp.pre).forEach(function (k) { r[k] = state.resp.pre[k]; });
  // 연습 기록 — 조작을 못 익힌 참가자를 나중에 가려낼 수 있게 남긴다
  Object.keys(state.practice || {}).forEach(function (k) { r[k] = state.practice[k]; });

  realBlocks().forEach(function (b) {
    var k = blockKey(b), store = state.resp.blocks[k] || {};
    r[k + '_ver'] = b.ver;
    r[k + '_순서'] = b.block;
    S.BLOCK_ITEMS.forEach(function (it) { r[k + '_' + it.id] = store[it.id]; });
    S.SUBSCALES.forEach(function (sc) { r[k + '_' + sc.key + '_M'] = S.subscaleMean(sc.key, store); });
  });

  S.ATTENTION_BLOCKS.forEach(function (n) {
    var v = state.resp.attention['b' + n];
    r['응답확인_광고' + n] = (v === undefined ? null : v);
    r['응답확인_광고' + n + '_통과'] = (v === undefined || v === null) ? null : (v === S.ATTENTION.expect ? 1 : 0);
  });

  state.logs.forEach(function (L) {
    var p = L.stim + '_' + L.mode + '_';
    Object.keys(L).forEach(function (k) {
      if (['sid', 'stim', 'mode'].indexOf(k) >= 0) return;
      r[p + k] = L[k];
    });
  });

  Object.keys(state.resp.demo).forEach(function (k) { r[k] = state.resp.demo[k]; });
  return [r];
}

function toCsv(rows) {
  if (!rows.length) return '';
  var keys = [];
  rows.forEach(function (row) {
    Object.keys(row).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
  });
  var cell = function (v) {
    if (v === null || v === undefined) return '';   // 공란은 null 이지 0 이 아니다
    if (typeof v === 'object') v = JSON.stringify(v);
    var s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '﻿' + [keys.join(',')].concat(rows.map(function (row) {
    return keys.map(function (k) { return cell(row[k]); }).join(',');
  })).join('\n');
}

function download(name, text, mime) {
  var url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
  var a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

/* ==========================================================
 * 8. 시작
 * ========================================================== */

state.group = groupOf(state.sid);
state.seq = buildSeq();

if (location.protocol === 'file:') {

            '<span class="mono">http://localhost:8000/preview.html</span> 로 여세요.');
} else {

    showStart(r.ok ? null :
      'game/dist/ 가 없습니다. <span class="mono">cd game &amp;&amp; npm run build</span> 를 먼저 실행하세요.');
  }).catch(function () {
    showStart('game/dist/ 를 찾지 못했습니다. <span class="mono">cd game &amp;&amp; npm run build</span> 를 먼저 실행하세요.');
  });
}
